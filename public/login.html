<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar | ERP Bebidas</title>
    <meta name="description" content="Acceso al sistema de inventario y ventas ERP Bebidas.">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif; min-height: 100vh; display: grid; place-items: center;
            background: radial-gradient(circle at 20% 20%, #3b1470 0%, transparent 45%),
                        radial-gradient(circle at 80% 80%, #0f4c5c 0%, transparent 45%), #0b0b14;
            color: #f1f1f6; padding: 1rem;
        }
        .card {
            width: 100%; max-width: 380px; padding: 2.5rem 2rem; border-radius: 20px;
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(16px); box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            animation: rise .5s ease-out;
        }
        @keyframes rise { from { opacity: 0; transform: translateY(20px); } }
        .logo { font-size: 2.5rem; text-align: center; }
        h1 { text-align: center; font-size: 1.6rem; margin: .5rem 0 .3rem;
             background: linear-gradient(90deg, #b57cff, #4fd1c5); -webkit-background-clip: text; background-clip: text; color: transparent; }
        p { text-align: center; color: #9a9ab0; margin-bottom: 1.8rem; font-size: .95rem; }
        input {
            width: 100%; padding: .9rem 1rem; border-radius: 12px; font: inherit; color: inherit;
            background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.12); outline: none; transition: border-color .2s, box-shadow .2s;
        }
        input:focus { border-color: #b57cff; box-shadow: 0 0 0 3px rgba(181,124,255,0.25); }
        button {
            width: 100%; margin-top: 1rem; padding: .9rem; border: 0; border-radius: 12px; cursor: pointer;
            font: 600 1rem 'Outfit', sans-serif; color: white;
            background: linear-gradient(135deg, #8a2be2, #4fd1c5); transition: transform .15s, filter .2s;
        }
        button:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .error { color: #ff6b8a; text-align: center; margin-top: 1rem; min-height: 1.2em; font-size: .9rem; }
    </style>
</head>
<body>
    <main class="card">
        <div class="logo">🥤</div>
        <h1>ERP Bebidas</h1>
        <p>Ingresa la contraseña para continuar</p>
        <form id="login-form">
            <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required autofocus>
            <button id="btn-login" type="submit">Entrar</button>
        </form>
        <div class="error" id="error"></div>
    </main>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const res = await fetch('/api/login', {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password: document.getElementById('password').value })
            });
            if (res.ok) location.href = '/';
            else document.getElementById('error').textContent = 'Contraseña incorrecta';
        });
    </script>
</body>
</html>
